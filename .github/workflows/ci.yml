name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  userscript:
    name: Userscript Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and verify boundaries
        run: pnpm lint

      - name: Unit and Golden tests
        run: pnpm test

      - name: Build and verify Userscript
        run: pnpm build:userscript

      - name: Build experimental pure API bundle
        run: pnpm build:pure-userscript

      - name: Upload Userscript artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subbatch-userscript
          path: |
            dist/userscript/subbatch.user.js
            dist/userscript/subbatch.compat.user.js
            dist/userscript/subbatch.pure.user.js
          if-no-files-found: error
